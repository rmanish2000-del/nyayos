# NyayOS — status update
#
# When the status registry changes on `main`, regenerate the derived governance
# documents (status dashboard, dependency graph, registry view) and append an
# auto-generated changelog entry describing the status transitions.
#
# `main` is protected with required status checks, so this job does NOT push to
# `main`. It pushes to `governance/status-update` and opens (or refreshes) a pull
# request. `task-gate` and the founder then gate the merge like any other change.
# Pushes made with GITHUB_TOKEN do not trigger further workflow runs, so there is no loop.

name: status-update

on:
  push:
    branches: [main]
    paths:
      - "docs/founder/NYAYOS_STATUS_REGISTRY.json"
      - "scripts/governance/registry.mjs"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: status-update
  cancel-in-progress: false

jobs:
  status-update:
    name: status-update
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate registry (never render an invalid registry)
        run: node scripts/governance/registry.mjs validate

      - name: Snapshot previous registry for the changelog diff
        id: prev
        run: |
          if git show HEAD~1:docs/founder/NYAYOS_STATUS_REGISTRY.json > /tmp/prev-registry.json 2>/dev/null; then
            echo "has_prev=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_prev=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Regenerate derived documents
        run: node scripts/governance/registry.mjs generate

      - name: Append auto changelog entry
        if: steps.prev.outputs.has_prev == 'true'
        run: node scripts/governance/registry.mjs changelog --previous /tmp/prev-registry.json

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -- docs/founder; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; echo "derived documents already in sync"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"; git --no-pager diff --stat -- docs/founder
          fi

      - name: Push branch and open / refresh pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          git config user.name  "nyayos-governance-bot"
          git config user.email "governance-bot@users.noreply.github.com"
          BR=governance/status-update
          git checkout -B "$BR"
          git add docs/founder
          git commit -m "docs(auto): regenerate status dashboard, dependency graph and changelog

Source: docs/founder/NYAYOS_STATUS_REGISTRY.json @ ${GITHUB_SHA}
Generated by scripts/governance/registry.mjs in the status-update workflow.

[A-019]"
          git push --force-with-lease origin "$BR"
          if gh pr view "$BR" --json number -q .number >/dev/null 2>&1; then
            echo "pull request already open — branch refreshed"
          else
            gh pr create --base main --head "$BR" \
              --title "docs(auto): status registry changed — regenerate dashboard, graph, changelog [A-019]" \
              --body "Auto-generated by the \`status-update\` workflow from \`docs/founder/NYAYOS_STATUS_REGISTRY.json\` at \`${GITHUB_SHA}\`.

**Assignment:** A-019 (Repository Automation Foundation)

Contains only derived documents:
- \`docs/founder/NYAYOS_STATUS_DASHBOARD.md\`
- \`docs/founder/NYAYOS_DEPENDENCY_GRAPH.md\`
- \`docs/founder/NYAYOS_STATUS_REGISTRY.md\`
- \`docs/founder/NYAYOS_CHANGELOG.md\` (appended \`[auto]\` entry)

No product code. No deployment. Merge when \`task-gate\` is green."
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "## status-update"
            echo
            echo "- registry changed at: \`${GITHUB_SHA}\`"
            echo "- derived documents changed: \`${{ steps.diff.outputs.changed }}\`"
            echo "- delivery: pull request from \`governance/status-update\` (main is protected)"
          } >> "$GITHUB_STEP_SUMMARY"
